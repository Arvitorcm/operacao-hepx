    function resetInteractiveDraftState() {
      eliminatedOpts = { d1: {}, d2: {}, d3: {} };
      simState = { aEnv: "lumen", aUpr: "normal", dPump: "on", dRupture: "closed", aCaseFilter: "all", cCaseFilter: "all" };
      vaultSuspectId = null;
      vaultDraftDigits = ["", "", "", ""];
    }

    function acceptVillainChallenge() {
      state.introSeen = true;
      saveState();
      render();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function continueAfterModuleClear() {
      state.justCleared = null;
      saveState();
      render();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function pickVaultSuspect(agentId) {
      ["m_d1", "m_d2", "m_d3", "m_d4"].forEach((id, i) => {
        const el = document.getElementById(id);
        if (el) vaultDraftDigits[i] = el.value;
      });
      vaultSuspectId = Number(agentId);
      renderMasterVault(document.getElementById("appContainer"));
    }

    function getVaultSuspectOptions(team) {
      const targetId = team.agent;
      const allIds = Object.keys(AGENTS).map(Number);
      const others = allIds.filter(id => id !== targetId);
      // Seleção determinística de 3 distratores diferentes + o caso real, embaralhada por team.id
      const picks = [
        targetId,
        others[(team.id * 2) % others.length],
        others[(team.id * 5 + 3) % others.length],
        others[(team.id * 7 + 5) % others.length]
      ];
      // Garante 4 IDs únicos caso algum módulo coincida
      const uniq = [];
      picks.forEach(id => { if (!uniq.includes(id)) uniq.push(id); });
      for (const id of others) {
        if (uniq.length >= 4) break;
        if (!uniq.includes(id)) uniq.push(id);
      }
      // Rotação determinística pela id da equipe para a resposta certa não ficar sempre na posição 1
      const shift = team.id % 4;
      const ordered = uniq.map((_, i) => uniq[(i + shift) % 4]);
      return ordered.map(id => ({ id, desc: AGENTS[id].desc }));
    }

    function toggleEliminateOpt(slot, val) {
      if (!eliminatedOpts[slot]) eliminatedOpts[slot] = {};
      const key = String(val);
      eliminatedOpts[slot][key] = !eliminatedOpts[slot][key];
      renderModule(document.getElementById("appContainer"));
    }

    function setSimState(key, val) {
      simState[key] = val;
      renderModule(document.getElementById("appContainer"));
    }

    function scrollToLockPanel() {
      const el = document.getElementById("moduleLockPanel");
      if (el) el.scrollIntoView({ behavior: "smooth", block: "center" });
    }

    function ensureMonitorTeamState(preferredTeamId) {
      const targetId = Number(preferredTeamId) || state.teamId || tempSelectedTeam || 1;
      state.teamId = targetId;
      if (!state.startedAt) state.startedAt = Date.now();
      if (!Array.isArray(state.members) || state.members.some(m => !m || m.trim().length < 2)) {
        state.members = [1, 2, 3, 4, 5].map(i => `Especialista ${i}`);
      }
      state.cooldownUntil = 0;
      state.wrongStreak = 0;
    }

    function monitorOpenModule(modKey, preferredTeamId) {
      if (!isMonitorAuthenticated) return;
      ensureMonitorTeamState(preferredTeamId);
      const team = getTeam();
      if (!team) return;
      const idx = team.order.indexOf(modKey);
      state.introSeen = true;
      state.justCleared = null;
      state.stepIndex = idx >= 0 ? idx : 0;
      activeSubTab = "d1";
      draftDigits = { d1: "", d2: "", d3: "" };
      tblState = { s1: "", s2: "", s3: "" };
      resetInteractiveDraftState();
      localStorage.setItem("hepx_state_v4", JSON.stringify(state));
      closeMonitorModal();
      render();
    }

    function monitorJumpStep(stepIdx, preferredTeamId) {
      if (!isMonitorAuthenticated) return;
      ensureMonitorTeamState(preferredTeamId);
      state.introSeen = true;
      state.justCleared = null;
      state.stepIndex = stepIdx;
      activeSubTab = "d1";
      draftDigits = { d1: "", d2: "", d3: "" };
      tblState = { s1: "", s2: "", s3: "" };
      resetInteractiveDraftState();
      localStorage.setItem("hepx_state_v4", JSON.stringify(state));
      closeMonitorModal();
      render();
    }

    function monitorSwitchTeam(newTeamId) {
      if (!isMonitorAuthenticated) return;
      const currTeam = getTeam();
      const currModKey = (currTeam && state.stepIndex < 4) ? currTeam.order[state.stepIndex] : null;
      ensureMonitorTeamState(Number(newTeamId));
      const nextTeam = getTeam();
      if (currModKey && nextTeam) {
        const mappedIdx = nextTeam.order.indexOf(currModKey);
        if (mappedIdx >= 0) state.stepIndex = mappedIdx;
      }
      draftDigits = { d1: "", d2: "", d3: "" };
      tblState = { s1: "", s2: "", s3: "" };
      resetInteractiveDraftState();
      localStorage.setItem("hepx_state_v4", JSON.stringify(state));
      render();
    }

    function monitorResetToSetup() {
      if (!isMonitorAuthenticated) return;
      state = defaultState();
      tempSelectedTeam = null;
      draftDigits = { d1: "", d2: "", d3: "" };
      tblState = { s1: "", s2: "", s3: "" };
      resetInteractiveDraftState();
      localStorage.removeItem("hepx_state_v4");
      render();
    }

    function monitorAutoFillModule() {
      if (!isMonitorAuthenticated) return;
      const team = getTeam();
      if (!team || state.stepIndex >= 4) return;
      const modKey = team.order[state.stepIndex];
      const code = team.assign[modKey].code;
      draftDigits = { d1: code[0], d2: code[1], d3: code[2] };
      if (modKey === "C") {
        const pair = Object.entries(TBL_MAP).find(([, v]) => v === code[2]);
        if (pair) {
          tblState = { s1: pair[0][0], s2: pair[0][1], s3: pair[0][2] };
        }
      }
      renderModule(document.getElementById("appContainer"));
    }

    function monitorAutoFillMaster() {
      if (!isMonitorAuthenticated) return;
      const team = getTeam();
      if (!team) return;
      vaultDraftDigits = team.master.split("");
      vaultSuspectId = team.agent;
      renderMasterVault(document.getElementById("appContainer"));
    }

    function exitMonitorMode() {
      isMonitorAuthenticated = false;
      sessionStorage.removeItem("hepx_monitor_auth");
      const authBox = document.getElementById("monitorAuthBox");
      const content = document.getElementById("monitorContent");
      const passEl = document.getElementById("monitorPass");
      if (authBox) authBox.classList.remove("hidden");
      if (content) content.classList.add("hidden");
      if (passEl) passEl.value = "";
      render();
    }

    if (syncChannel) {
      syncChannel.onmessage = (ev) => {
        if (ev.data && ev.data.type === "BENCH_UPDATED" && state.teamId === ev.data.teamId) {
          state = Object.assign(defaultState(), ev.data.benchState);
          localStorage.setItem("hepx_state_v4", JSON.stringify(state));
          render();
        }
      };
    }

    const URL_PARAMS = new URLSearchParams(window.location.search);
    const ROOM_CODE = (URL_PARAMS.get("sala") || "").trim().toLowerCase().replace(/[^a-z0-9_-]/g, "").slice(0, 32);
    const CLOUD_TOPIC_PREFIX = ROOM_CODE ? `ufc/ch0856/hepx_live_v5_${ROOM_CODE}` : "ufc/ch0856/hepx_live_v5";
    const MQTT_BROKERS = [
      { url: "wss://broker.emqx.io:8084/mqtt", label: "EMQX" },
      { url: "wss://broker.hivemq.com:8884/mqtt", label: "HiveMQ" }
    ];
    let activeBrokerIdx = 0;
    let mqttClient = null;
    let isCloudConnected = false;
    let cloudFallbackTimer = null;

    function updateRoomBadge() {
      const el = document.getElementById("roomCodeBadge");
      if (el) el.textContent = ROOM_CODE ? `Sala: ${ROOM_CODE}` : "Sala: padrão";
    }

    function updateCloudBadge(connected) {
      isCloudConnected = connected;
      const dot = document.getElementById("remoteSyncDot");
      const txt = document.getElementById("remoteSyncText");
      const brokerLabel = MQTT_BROKERS[activeBrokerIdx]?.label || "Nuvem";
      if (dot && txt) {
        dot.className = connected ? "w-2 h-2 rounded-full bg-emerald-500 animate-pulse" : "w-2 h-2 rounded-full bg-amber-500 animate-pulse";
        txt.textContent = connected ? `Nuvem Ativa (${brokerLabel})` : `Conectando (${brokerLabel})...`;
      }
      updateRoomBadge();
    }

    function connectMqttBroker(idx) {
      if (typeof mqtt === "undefined") return;
      activeBrokerIdx = idx % MQTT_BROKERS.length;
      if (cloudFallbackTimer) {
        clearTimeout(cloudFallbackTimer);
        cloudFallbackTimer = null;
      }
      if (mqttClient) {
        try { mqttClient.end(true); } catch (e) {}
        mqttClient = null;
      }
      updateCloudBadge(false);
      const targetBroker = MQTT_BROKERS[activeBrokerIdx];
      try {
        const client = mqtt.connect(targetBroker.url, {
          clientId: "hepx_" + Math.random().toString(16).slice(2, 10),
          clean: true,
          connectTimeout: 5000,
          reconnectPeriod: 4000
        });
        mqttClient = client;

        cloudFallbackTimer = setTimeout(() => {
          if (!isCloudConnected && mqttClient === client) {
            connectMqttBroker(activeBrokerIdx + 1);
          }
        }, 6500);

        client.on("connect", () => {
          if (mqttClient !== client) return;
          if (cloudFallbackTimer) {
            clearTimeout(cloudFallbackTimer);
            cloudFallbackTimer = null;
          }
          updateCloudBadge(true);
          client.subscribe(`${CLOUD_TOPIC_PREFIX}/bench/+`);
          client.subscribe(`${CLOUD_TOPIC_PREFIX}/cmd/+`);
          if (state && state.teamId) publishBenchStateToCloud(state);
        });

        client.on("close", () => {
          if (mqttClient === client) updateCloudBadge(false);
        });
        client.on("error", () => {
          if (mqttClient === client) updateCloudBadge(false);
        });

        client.on("message", (topic, payload) => {
          try {
            const rawPayload = payload ? payload.toString().trim() : "";
            if (!rawPayload) {
              if (topic.startsWith(`${CLOUD_TOPIC_PREFIX}/bench/`)) {
                const removedId = Number(topic.split("/").pop());
                if (removedId) {
                  const map = loadBenchesMap();
                  delete map[removedId];
                  localStorage.setItem("hepx_benches_map_v4", JSON.stringify(map));
                  const modal = document.getElementById("monitorModal");
                  if (modal && !modal.classList.contains("hidden") && activeMonitorTab === "equipes") {
                    renderMonitorTabContent();
                  }
                  if (currentMonitorAction) renderMonitorActionDrawer();
                }
              }
              return;
            }
            const data = JSON.parse(rawPayload);
            if (topic.startsWith(`${CLOUD_TOPIC_PREFIX}/bench/`)) {
              if (data && data.teamId) {
                const map = loadBenchesMap();
                map[data.teamId] = data;
                localStorage.setItem("hepx_benches_map_v4", JSON.stringify(map));
                const modal = document.getElementById("monitorModal");
                if (modal && !modal.classList.contains("hidden") && activeMonitorTab === "equipes") {
                  renderMonitorTabContent();
                }
                if (currentMonitorAction) renderMonitorActionDrawer();
              }
            } else if (topic.startsWith(`${CLOUD_TOPIC_PREFIX}/cmd/`)) {
              const targetId = Number(topic.split("/").pop());
              if (data && targetId && state && state.teamId === targetId) {
                if (data.action === "unlock") {
                  state.cooldownUntil = 0;
                  state.wrongStreak = 0;
                } else if (data.action === "skip") {
                  state.stepIndex = 4;
                  state.introSeen = true;
                  state.justCleared = null;
                  state.cooldownUntil = 0;
                  state.wrongStreak = 0;
                } else if (data.action === "reset") {
                  localStorage.removeItem("hepx_state_v4");
                  state = defaultState();
                  draftDigits = { d1: "", d2: "", d3: "" };
                  tblState = { s1: "", s2: "", s3: "" };
                  resetInteractiveDraftState();
                }
                localStorage.setItem("hepx_state_v4", JSON.stringify(state));
                saveBenchToMap(state);
                if (data.action !== "reset") publishBenchStateToCloud(state);
                render();
              }
            }
          } catch (e) {}
        });
      } catch (e) {}
    }

    function initCloudSync() {
      updateRoomBadge();
      connectMqttBroker(0);
    }

    function publishBenchStateToCloud(benchState) {
      if (!mqttClient || !isCloudConnected || !benchState || !benchState.teamId) return;
      try {
        mqttClient.publish(`${CLOUD_TOPIC_PREFIX}/bench/${benchState.teamId}`, JSON.stringify(benchState), { qos: 0, retain: true });
      } catch (e) {}
    }

    function publishRemoteCommandToCloud(teamId, action, updatedBenchState) {
      if (!mqttClient || !isCloudConnected || !teamId) return;
      try {
        if (updatedBenchState) {
          mqttClient.publish(`${CLOUD_TOPIC_PREFIX}/bench/${teamId}`, JSON.stringify(updatedBenchState), { qos: 0, retain: true });
        }
        mqttClient.publish(`${CLOUD_TOPIC_PREFIX}/cmd/${teamId}`, JSON.stringify({ action, teamId, ts: Date.now() }), { qos: 0, retain: false });
      } catch (e) {}
    }

    function loadBenchesMap() {
      try {
        const raw = localStorage.getItem("hepx_benches_map_v4");
        const map = raw ? JSON.parse(raw) : {};
        if (state && state.teamId) map[state.teamId] = state;
        return map;
      } catch (e) {
        return {};
      }
    }

    function saveBenchToMap(benchState) {
      if (!benchState || !benchState.teamId) return;
      try {
        const map = loadBenchesMap();
        map[benchState.teamId] = JSON.parse(JSON.stringify(benchState));
        localStorage.setItem("hepx_benches_map_v4", JSON.stringify(map));
      } catch (e) {}
    }

    function loadState() {
      try {
        const raw = localStorage.getItem("hepx_state_v4");
        if (raw) {
          const parsed = JSON.parse(raw);
          const st = Object.assign(defaultState(), parsed);
          if (parsed.introSeen === undefined && st.stepIndex > 0) st.introSeen = true;
          if (st.teamId) {
            const rawMap = localStorage.getItem("hepx_benches_map_v4");
            if (rawMap) {
              const map = JSON.parse(rawMap);
              if (map[st.teamId]) {
                const mst = Object.assign(defaultState(), map[st.teamId]);
                if (map[st.teamId].introSeen === undefined && mst.stepIndex > 0) mst.introSeen = true;
                return mst;
              }
            }
          }
          return st;
        }
      } catch (e) {}
      return defaultState();
    }

    function saveState() {
      localStorage.setItem("hepx_state_v4", JSON.stringify(state));
      if (state && state.teamId) {
        saveBenchToMap(state);
        publishBenchStateToCloud(state);
      }
    }

    function getTeam() {
      return TEAMS.find(t => t.id === state.teamId);
    }

    function formatTime(ms) {
      const totalSec = Math.max(0, Math.floor(ms / 1000));
      const m = String(Math.floor(totalSec / 60)).padStart(2, "0");
      const s = String(totalSec % 60).padStart(2, "0");
      return `${m}:${s}`;
    }

    setInterval(() => {
      const el = document.getElementById("clockDisplay");
      if (el) {
        if (!state.startedAt) {
          el.textContent = "AGUARDANDO INÍCIO";
        } else {
          const end = state.finishedAt || Date.now();
          el.textContent = "TEMPO · " + formatTime(end - state.startedAt);
        }
      }
      const cdEl = document.getElementById("cooldownBanner");
      if (cdEl) {
        const rem = state.cooldownUntil - Date.now();
        if (rem > 0) {
          cdEl.classList.remove("hidden");
          const tEl = document.getElementById("cooldownTimer");
          if (tEl) tEl.textContent = formatTime(rem);
        } else if (!cdEl.classList.contains("hidden")) {
          cdEl.classList.add("hidden");
          state.wrongStreak = 0;
          saveState();
          render();
        }
      }
    }, 500);

    // RENDERIZAÇÃO PRINCIPAL
    // =========================================================================
    function render() {
      const c = document.getElementById("appContainer");
      if (!state.teamId) {
        renderSetup(c);
        return;

      if (!state.introSeen && state.stepIndex === 0 && !isMonitorAuthenticated) {
        renderVillainIntro(c);
        return;
      }
      if (state.justCleared) {
        renderModuleClearedTransition(c);
        return;
      }
      if (state.stepIndex < 4) {
        renderModule(c);
      } else if (state.stepIndex === 4) {
        renderMasterVault(c);
      } else if (state.stepIndex === 5) {
        renderDossier(c);
      } else {
        renderCertificate(c);
      }
    }

                  <span class="w-6 h-6 rounded-lg bg-cawRed text-white font-mono text-xs font-bold flex items-center justify-center">2</span>
                  <h2 class="font-heading font-extrabold text-lg text-charcoal">Escalação dos 5 Especialistas da Fase 1</h2>
                </div>
                <span class="font-mono text-xs text-cawBlue font-semibold">Cada integrante lidera a bancada em seu eixo de especialidade</span>
              </div>

              <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-5 gap-3.5">
                ${[0,1,2,3,4].map(i => {
                  const avKey = ROLE_AVATAR_KEYS[i];
                  const roleTitle = ROLES[i].split(' (')[0];
                  const roleSub = ROLES[i].split(' (')[1].replace(')', '');
                  return `
                    <div class="p-4 rounded-2xl bg-slate-50/80 border border-slate-200/90 hover:border-slate-300 flex flex-col items-center text-center transition-all">
                      <div class="caw-hex-outer mb-2.5" style="background:${ROLE_BADGE_COLORS[i]}">
                        <div class="caw-hex-inner">
                          <div class="caw-hex-core">
                            <img src="${CAW_ASSETS[avKey]}" alt="${roleTitle}" />
                          </div>
                        </div>
                      </div>
                      <span class="font-heading font-extrabold text-xs text-charcoal leading-tight">${roleTitle}</span>
                      <span class="font-mono text-[10px] font-semibold text-slate-500 mt-0.5 mb-3">${roleSub}</span>
                      <input type="text" id="m${i}" value="${escapeHtmlRaw(state.members[i] || '')}" placeholder="Nome do(a) especialista"
                        class="w-full px-3 py-2 rounded-xl bg-white border border-slate-200 text-xs font-semibold text-charcoal text-center focus:outline-none focus:border-cawRed focus:ring-2 focus:ring-cawRed/15 transition-all" />
                    </div>
                  `;
                }).join("")}
              </div>

              <div id="setupMsg" class="mt-4"></div>

              <button type="button" onclick="startMission()" class="mt-6 w-full py-4 rounded-2xl bg-cawRed hover:bg-clayDark text-white font-heading font-extrabold text-base tracking-wide transition-all shadow-md hover:shadow-lg active:translate-y-0.5">
                INICIAR OPERAÇÃO HEP-X →
              </button>
            </div>
          </div>
        </div>
      `;
    }

    function selectTeamCard(id) {
      tempSelectedTeam = id;
      [0,1,2,3,4].forEach(i => {
        const el = document.getElementById("m" + i);
        if (el) state.members[i] = el.value;
      });
      renderSetup(document.getElementById("appContainer"));
    }

    function startMission() {
      const rawMembers = [0,1,2,3,4].map(i => {
        const el = document.getElementById("m" + i);
        return el ? el.value.trim() : "";
      });
      state.members = rawMembers;

      if (!tempSelectedTeam) {
        document.getElementById("setupMsg").innerHTML = `
          <div class="p-3.5 rounded-xl bg-clay/15 border border-clay text-clay font-semibold text-xs">
            Selecione primeiro a sua Bancada acima.
          </div>`;
        return;
      }

      const missing = [];
      rawMembers.forEach((name, idx) => {
        if (!name || name.length < 2) missing.push(idx + 1);
      });

      if (missing.length > 0) {
        document.getElementById("setupMsg").innerHTML = `
          <div class="p-3.5 rounded-xl bg-clay/15 border border-clay text-clay font-semibold text-xs">
            Preencha o nome de todos os 5 especialistas para iniciar.
          </div>`;
        return;
      }
      state.teamId = tempSelectedTeam;
      state.members = rawMembers;
      state.startedAt = Date.now();
      state.introSeen = false;
      state.justCleared = null;
      state.stepIndex = 0;
      activeSubTab = "d1";
      draftDigits = { d1: "", d2: "", d3: "" };
      tblState = { s1: "", s2: "", s3: "" };
      resetInteractiveDraftState();
      saveState();
      render();
    }

    // =========================================================================
    // BARRA DE PROGRESSO E RASTROS BIOQUÍMICOS
    // =========================================================================
    function renderProgressBar(team) {
      const pills = team.order.map((modKey, idx) => {
        const isDone = idx < state.stepIndex;
        const isCurr = idx === state.stepIndex;
        const cls = isDone
          ? "bg-emerald-600 text-white border-emerald-600"
          : (isCurr ? "bg-cawRed text-white border-cawRed shadow-sm" : "bg-white text-slate-400 border-slate-200");
        if (isMonitorAuthenticated) {
          return `
            <button type="button" onclick="monitorJumpStep(${idx})"
              class="flex-1 min-w-[115px] px-3.5 py-2 rounded-xl border flex items-center justify-between text-xs transition-all cursor-pointer hover:ring-2 hover:ring-slate-900/30 ${cls}">
              <span class="font-heading font-bold">${idx + 1}ª · Módulo ${modKey}</span>
              <span class="font-mono text-[11px] font-bold">${isDone ? "✓ OK" : (isCurr ? "ATIVO" : "ABRIR")}</span>
            </button>
          `;
        }
        return `
          <div class="flex-1 min-w-[115px] px-3.5 py-2 rounded-xl border flex items-center justify-between text-xs transition-all ${cls}">
            <span class="font-heading font-bold">${idx + 1}ª · Módulo ${modKey}</span>
            <span class="font-mono text-[11px] font-bold">${isDone ? "✓ OK" : (isCurr ? "ATIVO" : "🔒")}</span>
          </div>
        `;
      }).join("");

      const isVaultCurr = state.stepIndex === 4 || state.stepIndex === 5;
      const isVaultDone = state.stepIndex >= 6;
      const vaultCls = isVaultDone
        ? "bg-emerald-600 text-white border-emerald-600"
        : (isVaultCurr ? "bg-cawRed text-white border-cawRed shadow-sm" : "bg-white text-slate-400 border-slate-200");

      const monitorBar = isMonitorAuthenticated ? `
        <div class="p-3 rounded-2xl bg-slate-900 text-white flex flex-wrap items-center justify-between gap-2 border border-slate-700">
          <div class="flex flex-wrap items-center gap-2">
            <span class="font-mono text-[11px] uppercase tracking-wider text-emerald-400 font-bold">🔓 Modo Monitor</span>
            <select onchange="monitorSwitchTeam(this.value)" class="h-8 px-2 rounded-lg bg-slate-800 border border-slate-600 text-xs font-mono text-white">
              ${TEAMS.map(t => `<option value="${t.id}" ${team.id === t.id ? "selected" : ""}>${t.pos} · ${t.name.split(" (")[0]}</option>`).join("")}
            </select>
          </div>
          <div class="flex flex-wrap items-center gap-1.5">
            ${["A", "B", "C", "D"].map(k => {
              const activeMod = state.stepIndex < 4 && team.order[state.stepIndex] === k;
              return `<button type="button" onclick="monitorOpenModule('${k}')" class="h-8 px-2.5 rounded-lg font-mono text-xs font-bold transition-colors ${activeMod ? 'bg-cawRed text-white ring-2 ring-white/40' : 'bg-slate-800 hover:bg-slate-700 text-slate-200'}">Mód. ${k}</button>`;
            }).join("")}
            <button type="button" onclick="monitorJumpStep(4)" class="h-8 px-2.5 rounded-lg font-mono text-xs font-bold ${state.stepIndex===4 ? 'bg-amber-500 text-white ring-2 ring-white/40' : 'bg-slate-800 hover:bg-slate-700 text-slate-200'}">Cofre</button>
            <button type="button" onclick="monitorJumpStep(5)" class="h-8 px-2.5 rounded-lg font-mono text-xs font-bold ${state.stepIndex===5 ? 'bg-emerald-600 text-white ring-2 ring-white/40' : 'bg-slate-800 hover:bg-slate-700 text-slate-200'}">Dossiê</button>
            <button type="button" onclick="monitorResetToSetup()" class="h-8 px-2.5 rounded-lg font-mono text-[11px] bg-slate-700 hover:bg-slate-600 text-slate-200">Início</button>
            <button type="button" onclick="exitMonitorMode()" class="h-8 px-2.5 rounded-lg font-mono text-[11px] bg-red-900/70 hover:bg-red-700 text-white">Sair</button>
          </div>
        </div>
      ` : "";

      const vaultPill = isMonitorAuthenticated
        ? `<button type="button" onclick="monitorJumpStep(4)" class="flex-1 min-w-[125px] px-3.5 py-2 rounded-xl border flex items-center justify-between text-xs cursor-pointer hover:ring-2 hover:ring-slate-900/30 ${vaultCls}">
             <span class="font-heading font-bold">5ª · Cofre Central</span>
             <span class="font-mono text-[11px] font-bold">${isVaultDone ? "✓" : "ABRIR"}</span>
           </button>`
        : `<div class="flex-1 min-w-[125px] px-3.5 py-2 rounded-xl border flex items-center justify-between text-xs ${vaultCls}">
             <span class="font-heading font-bold">5ª · Cofre Central</span>
             <span class="font-mono text-[11px] font-bold">${isVaultDone ? "✓" : "🔐"}</span>
           </div>`;

      const ag = AGENTS[team.agent];
      const unlockedCount = Math.min(4, state.stepIndex);
      const isNeutralized = state.stepIndex >= 5;
      const threatPct = isNeutralized ? 0 : Math.max(0, 100 - unlockedCount * 25);
      const threatBarColor = isNeutralized ? "bg-emerald-500" : (threatPct <= 25 ? "bg-amber-500" : "bg-cawRed");
      const villainStatusBadge = isNeutralized
        ? `<span class="px-2 py-0.5 rounded-md bg-emerald-600 text-white font-mono text-[10px] font-bold">NEUTRALIZADO</span>`
        : `<span class="px-2 py-0.5 rounded-md bg-cawRed text-white font-mono text-[10px] font-bold">AMEAÇA HEP-X: ${threatPct}%</span>`;
      const tauntText = isNeutralized ? VILLAIN_TAUNTS[5] : (VILLAIN_TAUNTS[unlockedCount] || VILLAIN_TAUNTS[0]);
      const cluesHtml = unlockedCount === 0
        ? `<span class="text-xs text-slate-500">Derrubem os 4 bloqueios para arrancar as 4 pistas forenses sobre a sabotagem do Agente HEP-X nesta bancada.</span>`
        : `<div class="grid grid-cols-1 sm:grid-cols-2 gap-2 mt-2">
            ${ag.clues.slice(0, unlockedCount).map(cl => `
              <div class="px-3 py-1.5 rounded-xl bg-slate-50 border border-slate-200/90 text-xs text-slate-700">
                <strong class="font-mono text-emerald-600">✓</strong> ${cl}
              </div>
            `).join("")}
          </div>`;

      return `
        <div class="space-y-2.5 mb-5">
          ${monitorBar}
          <div class="flex flex-wrap gap-2">
            ${pills}
            ${vaultPill}
          </div>

          <div class="px-4 py-3.5 rounded-2xl bg-white border border-slate-200/90 shadow-sm flex flex-col sm:flex-row items-start gap-3">
            <div class="caw-hex-sm shrink-0 mt-0.5" style="background:${isNeutralized ? '#059669' : '#E11D24'};">
              <div class="caw-hex-inner">
                <div class="caw-hex-core">
                  <img src="${CAW_ASSETS.villain_hex}" alt="Agente HEP-X" />
                </div>
              </div>
            </div>
            <div class="flex-1 w-full">
              <div class="flex flex-wrap items-center justify-between gap-2">
                <div class="flex flex-wrap items-center gap-2">
                  ${villainStatusBadge}
                  <span class="font-mono text-[11px] uppercase font-bold text-slate-700">Dossiê Forense (${unlockedCount}/4 Pistas)</span>
                </div>
                <span class="font-mono text-[11px] font-semibold text-slate-400">${team.name}</span>
              </div>
              <div class="w-full h-1.5 rounded-full bg-slate-100 overflow-hidden mt-2 mb-1.5">
                <div class="h-full ${threatBarColor} transition-all duration-300" style="width:${isNeutralized ? 100 : threatPct}%"></div>
              </div>
              <p class="text-[11px] font-medium text-slate-600 italic">${tauntText}</p>
              ${cluesHtml}
            </div>
          </div>
        </div>
      `;
    }

    function switchSubTab(tab) {
      syncDraftInputs();
      activeSubTab = tab;
      renderModule(document.getElementById("appContainer"));
    }

    function syncDraftInputs() {
      const d1El = document.getElementById("d1");
      const d2El = document.getElementById("d2");
      const d3El = document.getElementById("d3");
      if (d1El) draftDigits.d1 = d1El.value;
      if (d2El) draftDigits.d2 = d2El.value;
      if (d3El) draftDigits.d3 = d3El.value;
    }

    function pickOptionDigit(slot, val) {
      syncDraftInputs();
      draftDigits[slot] = String(val);
      renderModule(document.getElementById("appContainer"));
    }

    // Cálculo TBL do Módulo C (3 julgamentos V/F → dígito 1 a 8)
    const TBL_MAP = { "VVV":"1", "VVF":"2", "VFV":"3", "VFF":"4", "FVV":"5", "FVF":"6", "FFV":"7", "FFF":"8" };
    function setTblVote(stmtKey, val) {
      syncDraftInputs();
      tblState[stmtKey] = val;
      if (tblState.s1 && tblState.s2 && tblState.s3) {
        const combo = tblState.s1 + tblState.s2 + tblState.s3;
        draftDigits.d3 = TBL_MAP[combo] || "";
      }
      renderModule(document.getElementById("appContainer"));
    }

    function renderOptionCards(slot, list, opts = {}) {
      const allowEliminate = Boolean(opts.allowEliminate);
      const elimMap = eliminatedOpts[slot] || {};
      return `
        <div class="grid grid-cols-1 gap-2">
          ${list.map(o => {
            const val = String(o[0]);
            const isPicked = String(draftDigits[slot]) === val;
            const isElim = Boolean(elimMap[val]) && !isPicked;
            return `
              <div class="flex items-stretch gap-1.5">
                <button type="button" onclick="pickOptionDigit('${slot}', '${val}')"
                  class="flex-1 text-left p-3 rounded-xl border transition-all flex items-center gap-3 ${isPicked ? 'bg-slate-900 text-white border-slate-900 shadow-sm' : (isElim ? 'bg-slate-100/70 text-slate-400 border-slate-200/70 opacity-60' : 'bg-white hover:bg-slate-50 text-charcoal border-slate-200')}">
                  <span class="w-8 h-8 rounded-lg font-mono font-bold text-sm flex items-center justify-center shrink-0 ${isPicked ? 'bg-cawRed text-white' : (isElim ? 'bg-slate-200 text-slate-400' : 'bg-slate-100 text-slate-700')}">
                    ${o[0]}
                  </span>
                  <span class="text-xs sm:text-sm font-medium ${isElim ? 'line-through' : ''}">${o[1]}</span>
                </button>
                ${allowEliminate ? `
                  <button type="button" onclick="toggleEliminateOpt('${slot}', '${val}')" title="${isElim ? 'Restaurar hipótese' : 'Descartar hipótese'}"
                    class="w-10 rounded-xl border font-mono text-xs font-bold flex items-center justify-center shrink-0 transition-colors ${isElim ? 'bg-slate-800 text-white border-slate-800' : 'bg-white hover:bg-red-50 text-slate-400 hover:text-cawRed border-slate-200'}">
                    ${isElim ? '↺' : '✕'}
                  </button>
                ` : ''}
              </div>
            `;
          }).join("")}
        </div>
      `;
    }

    function optionTextMap(list) {
      const m = {};
      list.forEach(o => { m[String(o[0])] = o[1]; });
      return m;
    }

    // =========================================================================
    // MAPAS VISUAIS E SIMULADORES INTERATIVOS DA FASE 2
    // =========================================================================
    function renderModATab1(mod, assign) {
      const picked = String(draftDigits.d1 || "");
      const routeBtn = (digit, branchLabel, tone = "slate") => {
        const isPicked = picked === digit;
        const baseTone = tone === "blue"
          ? "bg-blue-50/90 hover:bg-blue-100 border-blue-200 text-slate-800"
          : tone === "red"
            ? "bg-rose-50/90 hover:bg-rose-100 border-rose-200 text-slate-800"
            : "bg-white hover:bg-slate-50 border-slate-200 text-slate-800";
        return `
          <button type="button" onclick="pickOptionDigit('d1', '${digit}')"
            class="w-full text-left p-3 rounded-xl border-2 transition-all flex items-center justify-between gap-2.5 ${isPicked ? 'bg-slate-900 text-white border-cawRed shadow-md ring-2 ring-cawRed/25' : baseTone}">
            <span class="flex items-center gap-2.5 min-w-0">
              <span class="px-2.5 py-1 rounded-lg font-mono font-bold text-xs shrink-0 whitespace-nowrap ${isPicked ? 'bg-cawRed text-white' : 'bg-slate-900/10 text-slate-800'}">ROTA ${digit}</span>
              <span class="font-mono text-[11px] font-semibold leading-tight ${isPicked ? 'text-cawSky' : 'text-slate-600'}">${branchLabel}</span>
            </span>
            <span class="font-mono text-xs font-bold shrink-0 whitespace-nowrap ${isPicked ? 'text-emerald-400' : 'text-slate-400'}">${isPicked ? '✓' : '→'}</span>
          </button>
        `;
      };

      return `
        <div class="space-y-4">
          <div class="p-4 rounded-2xl bg-amber-50 border border-amber-200 text-xs sm:text-sm text-amber-950 leading-relaxed">
            <span class="font-mono text-[11px] uppercase tracking-wider text-cawRed font-bold block mb-1">📄 CHAVE FÍSICA OBRIGATÓRIA · CONSULTE O PDF 13 (PÁG. 1) NA MESA</span>
            A tela exibe apenas os códigos <strong>ROTA 1 a ROTA 7</strong>. Percorram juntos a <strong>Chave Dicotômica impressa na mesa</strong> para descobrir qual rota corresponde ao experimento!
          </div>

          <div class="p-5 sm:p-6 rounded-2xl bg-slate-900 text-white border-l-4 border-cawRed space-y-2 shadow-sm">
            <span class="font-mono text-[11px] uppercase tracking-wider text-cawSky font-bold">PROTOCOLO EXPERIMENTAL · IMPORTAÇÃO → 1º DÍGITO</span>
            <p class="font-heading font-bold text-base sm:text-lg leading-snug text-white">${mod.qChave[assign.q]}</p>
          </div>

          <div class="p-4 rounded-2xl bg-slate-50 border-2 border-dashed border-slate-300 space-y-3">
            <div class="flex flex-wrap items-center justify-between gap-2">
              <span class="font-mono text-[11px] uppercase font-bold text-slate-700">🧬 Selecione a Rota encontrada na Chave Dicotômica do PDF 13:</span>
              <span class="font-mono text-[11px] font-bold ${picked ? 'text-emerald-700' : 'text-slate-400'}">${picked ? 'Rota ' + picked + ' marcada' : 'Aguardando rota'}</span>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
              <div class="p-3 rounded-2xl bg-white border border-slate-200 space-y-2">
                <span class="font-mono text-[10px] uppercase tracking-wider text-cawBlue font-bold block">Ramo I · Fora do RE</span>
                ${routeBtn("1", "Ramo I · Citosol", "blue")}
                ${routeBtn("4", "Ramo I · Núcleo", "blue")}
                ${routeBtn("5", "Ramo I · Mitocôndria", "blue")}
              </div>

              <div class="p-3 rounded-2xl bg-white border border-slate-200 space-y-2">
                <span class="font-mono text-[10px] uppercase tracking-wider text-cawRed font-bold block">Ramos II e III · RE & Saída</span>
                ${routeBtn("6", "Ramo II · Entrada RE", "slate")}
                ${routeBtn("2", "Ramo II · Lúmen RE (Sinal)", "slate")}
                ${routeBtn("3", "Ramo II · Lúmen RE (Solúvel)", "slate")}
                ${routeBtn("7", "Ramo III · Saída ao Golgi", "red")}
              </div>
            </div>
          </div>
        </div>
      `;
    }

    function renderModBTab1(mod, assign) {
      const picked = String(draftDigits.d1 || "");
      const pieces = ["1", "2", "3", "4", "5", "6", "7"];
      return `
        <div class="space-y-4">
          <div class="p-4 rounded-2xl bg-amber-50 border border-amber-200 text-xs sm:text-sm text-amber-950 leading-relaxed">
            <span class="font-mono text-[11px] uppercase tracking-wider text-cawRed font-bold block mb-1">✂️ ATIVIDADE FÍSICA OBRIGATÓRIA · DOMINÓ NA MESA (PDF 06)</span>
            ${mod.tableInstruction} <strong>A tela não revela a ordem das proteínas:</strong> só quem montar o dominó físico saberá qual posição (<strong>1ª a 7ª</strong>) travou!
          </div>

          <div class="p-5 sm:p-6 rounded-2xl bg-slate-900 text-white border-l-4 border-cawRed space-y-2 shadow-sm">
            <span class="font-mono text-[11px] uppercase tracking-wider text-cawSky font-bold">GAMIFICAÇÃO TÁTIL · DEBUG DO DOMINÓ MOLECULAR → 1º DÍGITO</span>
            <p class="font-heading font-bold text-base sm:text-lg leading-snug text-white">${mod.qChave[assign.q]}</p>
          </div>

          <div class="p-4 rounded-2xl bg-slate-50 border border-slate-200 space-y-2.5">
            <span class="font-mono text-[11px] uppercase font-bold text-slate-700 block">🎲 Circuito Montado na Bancada (1ª → 7ª Posição) — Clique na posição exata em que o circuito trava:</span>
            <div class="grid grid-cols-2 sm:grid-cols-7 gap-2">
              ${pieces.map((d, idx) => {
                const isPicked = picked === d;
                const badge = idx === 0 ? "Peça G" : "Peça ?";
                return `
                  <button type="button" onclick="pickOptionDigit('d1', '${d}')"
                    class="text-center p-3 rounded-xl border-2 transition-all flex flex-col items-center justify-center gap-1 ${idx === 6 ? 'col-span-2 sm:col-span-1' : ''} ${isPicked ? 'bg-slate-900 text-white border-cawRed shadow-md ring-2 ring-cawRed/25' : 'bg-white hover:bg-slate-50 text-charcoal border-slate-300'}">
                    <span class="font-mono text-lg font-black whitespace-nowrap ${isPicked ? 'text-cawRed bg-white px-2.5 py-0.5 rounded-lg' : 'text-slate-900'}">${d}ª</span>
                    <span class="font-mono text-[10px] font-bold uppercase whitespace-nowrap ${isPicked ? 'text-cawSky' : 'text-slate-500'}">${badge}</span>
                    <span class="font-mono text-[10px] whitespace-nowrap ${isPicked ? 'text-emerald-300' : 'text-slate-400'}">${idx === 0 ? 'Início' : (idx === 6 ? 'Fim' : 'Posição')}</span>
                  </button>
                `;
              }).join("")}
            </div>
          </div>
        </div>
      `;
    }

    function renderModCTab1(mod, assign) {
      const picked = String(draftDigits.d1 || "");
      const stationBtn = (d, tag, accent = "bg-white border-slate-300") => {
        const isPicked = picked === d;
        return `
          <button type="button" onclick="pickOptionDigit('d1', '${d}')"
            class="w-full text-left p-3 rounded-xl border-2 transition-all flex items-center justify-between gap-2.5 ${isPicked ? 'bg-slate-900 text-white border-cawRed shadow-md ring-2 ring-cawRed/20' : accent + ' hover:brightness-95 text-charcoal'}">
            <span class="flex items-center gap-2.5 min-w-0">
              <span class="w-8 h-8 rounded-lg font-mono font-bold text-sm flex items-center justify-center shrink-0 ${isPicked ? 'bg-cawRed text-white' : 'bg-slate-900/10 text-slate-800'}">${d}</span>
              <span class="font-mono text-xs font-bold leading-snug">ESTAÇÃO ${d} · <span class="${isPicked ? 'text-cawSky' : 'text-slate-500'}">${tag}</span></span>
            </span>
            <span class="font-mono text-xs font-bold shrink-0 whitespace-nowrap">${isPicked ? '✓' : '→'}</span>
          </button>
        `;
      };

    function tryUnlockModule() {
      if (state.cooldownUntil > Date.now()) return;
      syncDraftInputs();
      const team = getTeam();
      const modKey = team.order[state.stepIndex];
      const assign = team.assign[modKey];

      const entered = (draftDigits.d1 || "").trim() + (draftDigits.d2 || "").trim() + (draftDigits.d3 || "").trim();

      if (entered.length !== 3) {
        msgEl.innerHTML = `

          </div>`;
        return;
      }

      if (entered === assign.code) {
        state.wrongStreak = 0;
        state.stepIndex += 1;
        state.justCleared = { modKey };
        activeSubTab = "d1";
        draftDigits = { d1: "", d2: "", d3: "" };

        resetInteractiveDraftState();
        saveState();
        render();

        state.totalErrors += 1;

      } else {
        document.getElementById("monitorAuthMsg").innerHTML = `
          <div class="p-3 rounded-xl bg-clay/15 border border-clay text-clay text-xs font-semibold">
            Senha incorreta.
          </div>`;
      }
    }

    function openMonitorBenchAction(actionType) {
      currentMonitorAction = actionType;
      const map = loadBenchesMap();
      const activeIds = Object.keys(map).map(Number).filter(id => id >= 1 && id <= 10);
      if (state && state.teamId && !activeIds.includes(state.teamId)) activeIds.push(state.teamId);
      if (!selectedMonitorTeamId) selectedMonitorTeamId = state.teamId || (activeIds.length > 0 ? activeIds[0] : 1);
      renderMonitorActionDrawer();
    }

    function closeMonitorActionDrawer() {
      currentMonitorAction = null;
      const drawer = document.getElementById("monitorActionDrawer");
      if (drawer) drawer.classList.add("hidden");
    }

    function selectMonitorTargetBench(teamId) {
      selectedMonitorTeamId = teamId;
      renderMonitorActionDrawer();
    }

    function renderMonitorActionDrawer() {
      const drawer = document.getElementById("monitorActionDrawer");
      if (!drawer || !currentMonitorAction) return;
      drawer.classList.remove("hidden");

      const isUnlock = currentMonitorAction === "unlock";
      const map = loadBenchesMap();

      const cardsHtml = TEAMS.map(t => {
        const bState = map[t.id];
        const isActive = Boolean(bState && bState.teamId);
        const isSelected = selectedMonitorTeamId === t.id;
        const isBlocked = isActive && bState.cooldownUntil && bState.cooldownUntil > Date.now();

        let statusBadge = `<span class="font-mono text-[10px] text-charcoal/55">Aguardando</span>`;
        if (isActive) {
          if (isBlocked) {
            statusBadge = `<span class="font-mono text-[10px] text-clay font-bold">Bloqueada (${formatTime(bState.cooldownUntil - Date.now())})</span>`;
          } else if (bState.stepIndex < 4) {
            statusBadge = `<span class="font-mono text-[10px] text-moss font-bold">Módulo ${t.order[bState.stepIndex]} (${bState.stepIndex + 1}/4)</span>`;
          } else {
            statusBadge = `<span class="font-mono text-[10px] text-moss font-bold">No Cofre</span>`;
          }
        }

        return `
          <button type="button" onclick="selectMonitorTargetBench(${t.id})"
            class="text-left p-3 rounded-xl border transition-all ${isSelected ? 'bg-moss text-cream border-moss' : 'bg-white text-charcoal border-moss/15'}">
            <div class="font-heading font-bold text-xs">${t.pos} · ${t.name.replace('Equipe ', '')}</div>
            <div class="mt-1">${statusBadge}</div>
          </button>
        `;
      }).join("");

      const selectedTeam = TEAMS.find(t => t.id === selectedMonitorTeamId);
      drawer.innerHTML = `
        <div class="flex items-center justify-between">
          <h4 class="font-heading font-bold text-base text-charcoal">
            ${isUnlock ? 'Destravar Bloqueio de 90 s' : 'Pular Bancada para o Cofre Final'}
          </h4>
          <button type="button" onclick="closeMonitorActionDrawer()" class="text-xs font-semibold text-charcoal/70">Cancelar ✕</button>
        </div>
        <div class="grid grid-cols-2 sm:grid-cols-5 gap-2">${cardsHtml}</div>
        <div id="monitorActionFeedback"></div>
        <div class="flex justify-end">
          <button type="button" onclick="executeMonitorBenchAction()" class="h-10 px-5 rounded-xl ${isUnlock ? 'bg-moss' : 'bg-clay'} text-cream text-xs font-bold">
            Confirmar em ${selectedTeam ? selectedTeam.pos : ''}
          </button>
        </div>
      `;
    }

    function executeMonitorBenchAction() {
      if (!selectedMonitorTeamId || !currentMonitorAction) return;
      const targetTeam = TEAMS.find(t => t.id === selectedMonitorTeamId);
      if (!targetTeam) return;

      const map = loadBenchesMap();
      const hadExisting = Boolean(map[selectedMonitorTeamId]);
      let bState = map[selectedMonitorTeamId];
      if (!bState) {
        bState = defaultState();
        bState.teamId = selectedMonitorTeamId;
        bState.startedAt = Date.now();
        bState.members = [1,2,3,4,5].map(i => `Especialista ${i}`);
      }

      if (currentMonitorAction === "unlock") {
        bState.cooldownUntil = 0;
        bState.wrongStreak = 0;
      } else if (currentMonitorAction === "skip") {
        bState.stepIndex = 4;
        bState.introSeen = true;
        bState.justCleared = null;
        bState.cooldownUntil = 0;
        bState.wrongStreak = 0;
      }

      saveBenchToMap(bState);
      if (state.teamId === selectedMonitorTeamId) {
        state = Object.assign(defaultState(), bState);
        localStorage.setItem("hepx_state_v4", JSON.stringify(state));
        render();
      }
      if (syncChannel) {
        syncChannel.postMessage({ type: "BENCH_UPDATED", teamId: selectedMonitorTeamId, benchState: bState });
      }
      publishRemoteCommandToCloud(selectedMonitorTeamId, currentMonitorAction, hadExisting ? bState : null);
      renderMonitorActionDrawer();
      const fb = document.getElementById("monitorActionFeedback");
      if (fb) {
        fb.innerHTML = `<div class="p-3 rounded-xl bg-moss text-cream text-xs font-semibold">✓ Comando aplicado para ${targetTeam.name} (${targetTeam.pos}).</div>`;
      }
    }

    function clearCloudRoom() {
      if (mqttClient && isCloudConnected) {
        for (let id = 1; id <= 10; id++) {
          try {
            mqttClient.publish(`${CLOUD_TOPIC_PREFIX}/bench/${id}`, "", { qos: 0, retain: true });
            mqttClient.publish(`${CLOUD_TOPIC_PREFIX}/cmd/${id}`, JSON.stringify({ action: "reset", teamId: id, ts: Date.now() }), { qos: 0, retain: false });
          } catch (e) {}
        }
      }
      localStorage.removeItem("hepx_benches_map_v4");
      localStorage.removeItem("hepx_state_v4");
      state = defaultState();
      draftDigits = { d1: "", d2: "", d3: "" };
      tblState = { s1: "", s2: "", s3: "" };
      resetInteractiveDraftState();
      currentMonitorAction = null;
      selectedMonitorTeamId = null;
      closeMonitorActionDrawer();
      render();
      if (activeMonitorTab === "equipes") renderMonitorTabContent();
      const drawer = document.getElementById("monitorActionDrawer");
      if (drawer) {
        drawer.classList.remove("hidden");
        drawer.innerHTML = `<div class="p-3 rounded-xl bg-moss text-cream text-xs font-semibold">✓ Sala limpa (${ROOM_CODE || "padrão"}). Bancadas zeradas na nuvem e neste navegador.</div>`;
      }
    }

    window.addEventListener("DOMContentLoaded", () => {
      const bgEl = document.getElementById("cawCityBg");
      if (bgEl) bgEl.style.backgroundImage = `url('${CAW_ASSETS.city_bg}')`;
      render();
      initCloudSync();
    });
  </script>
</body>
</html>
